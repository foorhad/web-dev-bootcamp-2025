<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Latest Update</title>
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#F4F5F7] h-full">
    <div
      class="p-4 border-b-1 border-[#d9d2d2] max-w-lg mx-auto flex justify-between items-center bg-white"
    >
      <div class="flex items-center">
        <img src="assets/Group.png" alt="" />
        <div>
          <p class="font-extrabold">
            $<span id="total-amount">45000</span><br />
          </p>
          <p class="font-semibold text-[#8f8f8f]">Available Balance</p>
        </div>
      </div>
      <button class="text-[#8f8f8f] border-1 p-2 rounded-md">
        <i class="fa-solid fa-right-from-bracket rotate-180"></i> Log Out
      </button>
    </div>

    <div class="p-4 max-w-lg mx-auto bg-white rounded-b-2xl mb-5 pb-9">
      <h1 class="font-bold text-[24px] my-3">🔥 Welcome to Payooo!</h1>
      <p class="mb-10 text-[#bfbbbb] text-[18px]">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>
      <div class="grid grid-cols-3 gap-5">
        <div class="border-1 border-[#d9d2d2] p-4 text-center rounded-md">
          <img class="m-auto" src="assets/wallet1.png" alt="" />
          <p class="text-[#080808] mt-2">Add Money</p>
        </div>
        <div class="border-1 border-[#d9d2d2] p-4 text-center rounded-md">
          <img class="m-auto" src="assets/send1.png" alt="" />
          <p class="text-[#080808] mt-2">Cashout</p>
        </div>
        <div class="border-1 border-[#d9d2d2] p-4 text-center rounded-md">
          <img class="m-auto" src="assets/money1.png" alt="" />
          <p class="text-[#080808] mt-2">Transfer Money</p>
        </div>
        <div class="border-1 border-[#d9d2d2] p-4 text-center rounded-md">
          <img class="m-auto" src="assets/bonus1.png" alt="" />
          <p class="text-[#080808] mt-2">Get Bonus</p>
        </div>
        <div class="border-1 border-[#d9d2d2] p-4 text-center rounded-md">
          <img class="m-auto" src="assets/purse1.png" alt="" />
          <p class="text-[#080808] mt-2">Pay Bill</p>
        </div>
        <div class="border-1 border-[#d9d2d2] p-4 text-center rounded-md">
          <img class="m-auto" src="assets/transaction1.png" alt="" />
          <p class="text-[#080808] mt-2">Transactions</p>
        </div>
      </div>
    </div>

    <div class="my-7 px-4 max-w-lg mx-auto">
      <h1 class="m-4 text-[18px] font-semibold">Cashout</h1>
      <form class="bg-pink-100 p-4 rounded-3xl">
        <label for="" class="font-medium font-[#080808]">Agent Number</label
        ><br />
        <input
          id="agent-number"
          class="p-2 border-none rounded-3xl w-full bg-[#F4F5F7]"
          type="number"
          placeholder="Enter 11 digit number"
        />
        <br /><br />
        <label for="" class="font-medium font-[#080808]">Amount</label><br />
        <input
          id="withdraw-amount"
          class="p-2 border-none rounded-3xl w-full bg-[#F4F5F7]"
          type="number"
          placeholder="Enter Amount to withdraw"
        />
        <br /><br />
        <label for="" class="font-medium font-[#080808]">Pin Number</label
        ><br />
        <input
          id="account-pin"
          class="p-2 border-none rounded-3xl w-full bg-[#F4F5F7]"
          type="password"
          placeholder="Enter 4 digit pin number"
        />
        <button
          id="withdraw-btn"
          class="my-4 p-1 text-white w-full bg-[#0874F2] rounded-3xl"
        >
          Withdraw Money
        </button>
      </form>
    </div>

    <script src="cash-out.js"></script>
  </body>
</html>
