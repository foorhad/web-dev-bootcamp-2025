<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body class="bg-[#F4F5F7] h-[100vh] flex justify-center items-center" >
    <form class="bg-white p-6 rounded-lg w-[350px]">
        <div class="bg-white">
            <label for="">Mobile Number</label><br>
            <input class="w-full mt-2 border-[#F4F5F7] bg-[#F4F5F7] p-1 rounded-3xl " type="number" required placeholder="Enter the number">
        </div>
        <div class=" bg-white my-5">
            <label for="">4 Digit Pin</label><br>
            <input class="w-full mt-2 border-[#F4F5F7] bg-[#F4F5F7] p-1 rounded-3xl " type="password" required placeholder="Enter 4 Digit pin">
        </div>
        <button class="p-1 text-white w-full bg-[#0874F2] rounded-3xl">Login</button>
    </form>
  </body>
</html>
